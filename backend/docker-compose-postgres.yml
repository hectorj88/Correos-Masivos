services:
  postgres:
    image: dhi.io/postgres:18.7-alpine3.23-dev
    container_name: postgres
    restart: unless-stopped
    #command: ["postgres", "-c", "max_connections=100"]
    command: ["-c", "max_connections=100"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    security_opt:
      - no-new-privileges:true
    networks:
      - db_network
    volumes:
      # Postgres 18 usa /var/lib/postgresql (el PGDATA queda en una subcarpeta por versión)
      - postgres_data:/var/lib/postgresql
    # Sin "ports": la base de datos NO se publica en el VPS ni en internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

networks:
  # Red privada solo para backend <-> postgres (sin salida a internet)
  db_network:
    name: db_network
    internal: true

volumes:
  postgres_data: